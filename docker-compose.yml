services:
  db:
    image: postgres:16
    container_name: tasknest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasknest
      POSTGRES_PASSWORD: tasknest
      POSTGRES_DB: tasknest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasknest"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
